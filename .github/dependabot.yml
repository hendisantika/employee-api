version: 2
updates:
  # Maven dependencies (pom.xml) & Maven Wrapper
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    assignees:
      - hendisantika
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework*"
      springdoc:
        patterns:
          - "org.springdoc*"
      testing:
        patterns:
          - "org.testcontainers*"
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
      maven-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "org.springframework*"
          - "org.springdoc*"
          - "org.testcontainers*"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    assignees:
      - hendisantika
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker images used in compose.yaml
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    assignees:
      - hendisantika
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build"
      include: scope
